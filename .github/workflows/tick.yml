# Будильник бота «Неделя бесплатных тренировок».
#
# Render free засыпает, своего планировщика у него нет. Поэтому раз в час
# GitHub дёргает /tick — бот просыпается и сам решает, кому что отправить.
# Повторный тик ничего не дублирует: каждое сообщение уходит один раз.
#
# Нужен секрет репозитория TICK_URL (Settings → Secrets and variables
# → Actions), например: https://sister-bot-e5q4.onrender.com/tick?key=ВАШ_TICK_KEY
# Можно положить и просто ключ (значение TICK_KEY из Render) — адрес соберётся сам.
# Пока секрета нет — будильник молча ничего не делает.

name: "Бот тренировок: тик"

on:
  schedule:
    # Раз в час, не чаще: каждый вызов будит бота минут на 15, а бесплатных
    # часов Render 750 в месяц на весь аккаунт (там же может жить сайт школы).
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: sisters-bot-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Разбудить бота и запустить рассылку
        env:
          TICK_URL: ${{ secrets.TICK_URL }}
        run: |
          if [ -z "$TICK_URL" ]; then
            echo "Секрет TICK_URL не задан — пропускаю."
            exit 0
          fi
          # Убираем пробелы и переводы строк, случайно попавшие при вставке.
          URL="$(printf '%s' "$TICK_URL" | tr -d '[:space:]')"
          # Бот переехал во второй кабинет Render (09.11.2026): адрес берём отсюда,
          # из секрета — только ключ (или старый адрес, из которого вынимаем ключ).
          BOT_URL="https://sister-bot-e5q4.onrender.com"
          case "$URL" in
            http://*|https://*)
              KEY="$(printf '%s' "$URL" | sed -n 's/.*[?&]key=\([^&]*\).*/\1/p')"
              [ -n "$KEY" ] && URL="$BOT_URL/tick?key=$KEY" ;;
            *)
              echo "В TICK_URL не адрес, а одно слово — считаю его ключом TICK_KEY."
              URL="$BOT_URL/tick?key=$URL" ;;
          esac
          case "$URL" in */tick\?key=?*) ;; *)
            echo "::error::В TICK_URL нет '/tick?key=…'. Нужно: https://sister-bot-e5q4.onrender.com/tick?key=ВАШ_TICK_KEY"
            exit 1 ;;
          esac
          echo "::add-mask::$URL"
          # Первый запрос может ждать, пока Render проснётся (до минуты).
          code=$(curl --silent --show-error --output /tmp/tick.out --write-out '%{http_code}' \
               --retry 4 --retry-delay 20 --retry-all-errors \
               --max-time 600 "$URL") || true
          echo "Ответ бота: HTTP $code"
          head -c 2000 /tmp/tick.out 2>/dev/null; echo
          case "$code" in
            200) ;;
            403) echo "::error::Ключ не подходит: в TICK_URL ключ не тот, что TICK_KEY в Render."; exit 1 ;;
            *)   echo "::error::Бот не ответил как надо (HTTP $code)."; exit 1 ;;
          esac
